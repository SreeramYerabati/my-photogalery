<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>`Responsive Photo Gallery`</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="gallery-header">
        <h1>My Photo Album</h1>
        <p>A simple, clean, and fully responsive grid layout</p>
    </header>

    <main class="gallery-container">
        <!-- Gallery Item 1 -->
        <div class="gallery-item">
            <img src="https://picsum.photos" alt="Beautiful Landscape">
            <div class="caption">Mountain Peak</div>
        </div>

        <!-- Gallery Item 2 -->
        <div class="gallery-item">
            <img src="https://picsum.photos" alt="Ocean Waves">
            <div class="caption">Ocean Breeze</div>
        </div>

        <!-- Gallery Item 3 -->
        <div class="gallery-item">
            <img src="https://picsum.photos" alt="Forest Path">
            <div class="caption">Forest Path</div>
        </div>

        <!-- Gallery Item 4 -->
        <div class="gallery-item">
            <img src="https://picsum.photos" alt="City Lights">
            <div class="caption">City Architecture</div>
        </div>

        <!-- Gallery Item 5 -->
        <div class="gallery-item">
            <img src="https://picsum.photos" alt="Desert Dunes">
            <div class="caption">Desert Dunes</div>
        </div>

        <!-- Gallery Item 6 -->
        <div class="gallery-item">
            <img src="https://picsum.photos" alt="Misty Morning">
            <div class="caption">Misty Lake</div>
        </div>
    </main>

</body>
</html>
